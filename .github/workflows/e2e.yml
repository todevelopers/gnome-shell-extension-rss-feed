name: E2E

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'promo/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'promo/**'
  workflow_dispatch:
    inputs:
      only:
        description: Scenarios separated by commas (empty runs all of them)
        required: false
        default: ''
      theme:
        description: Colour scheme
        type: choice
        options: [both, dark, light]
        default: both
      gnome:
        description: GNOME version (46 and 50 on Ubuntu LTS, the others on Fedora)
        type: choice
        options: ['46', '47', '48', '49', '50', '51', all]
        default: '46'

permissions:
  contents: read

concurrency:
  # a manual run and a push to the same branch must not cancel each other
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: GNOME Shell ${{ matrix.gnome }}, ${{ matrix.theme }}
    # the GNOME version of the image is the point, so no ubuntu-latest
    runs-on: ${{ matrix.gnome == '50' && 'ubuntu-26.04' || 'ubuntu-24.04' }}
    # 46 and 50 are the Shell of an Ubuntu LTS runner itself, the others come from the Fedora release that ships them
    container: ${{ fromJSON('{"46":"","47":"quay.io/fedora/fedora:41","48":"quay.io/fedora/fedora:42","49":"quay.io/fedora/fedora:43","50":"","51":"quay.io/fedora/fedora:45"}')[matrix.gnome] }}
    timeout-minutes: 20
    strategy:
      # one red job must not cancel the others
      fail-fast: false
      matrix:
        # a push and a pull request run the versions whose only failures are known bugs of the extension
        gnome: ${{ fromJSON(inputs.gnome == 'all' && '["46", "47", "48", "49", "50", "51"]' || inputs.gnome && format('["{0}"]', inputs.gnome) || '["46", "47", "48", "49", "50"]') }}
        theme: ${{ fromJSON(inputs.theme == 'dark' && '["dark"]' || inputs.theme == 'light' && '["light"]' || '["dark", "light"]') }}
    defaults:
      run:
        # a container job would use sh
        shell: bash
    env:
      UUID: rss-feed@gnome-shell-extension.todevelopers.github.com
      # the same place on the runner and inside a container, where the suite runs as another user
      E2E_HOME: /tmp/e2e-home
    steps:
      # before the checkout, which needs git inside a container to leave a repository behind
      - name: Install GNOME Shell
        run: |
          if command -v apt-get > /dev/null; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              gnome-shell gjs at-spi2-core dconf-gsettings-backend dconf-service dbus-daemon libglib2.0-bin \
              libgl1-mesa-dri librsvg2-common adwaita-icon-theme fonts-cantarell
          else
            dnf install -y --setopt=install_weak_deps=False --skip-unavailable \
              gnome-shell gjs at-spi2-core dconf dbus-daemon glib2 mesa-dri-drivers librsvg2 adwaita-icon-theme \
              adwaita-sans-fonts abattis-cantarell-vf-fonts git python3 curl tar util-linux findutils gawk
            # a container job is root, the Shell is tested as a normal user
            useradd -m tester
          fi
          gnome-shell --version
      - uses: actions/checkout@v4
      - name: Install the extension
        run: |
          dir="$E2E_HOME/.local/share/gnome-shell/extensions/$UUID"
          mkdir -p "$dir"
          # inside a container the checkout belongs to another user than the one running git
          git -c safe.directory="$PWD" archive HEAD | tar -x -C "$dir"
          ls "$dir"
      # TEMPORARY: what else fails on GNOME 51 once the installed copy stops using St.BoxLayout:vertical
      - name: Patch the installed copy
        run: |
          cd "$E2E_HOME/.local/share/gnome-shell/extensions/$UUID"
          sed -i '/vertical : false,/d' ui/indicator.js
          sed -i 's/let titleBox = new St.BoxLayout({ vertical : true, x_expand : true });/let titleBox = new St.BoxLayout({ x_expand : true }); titleBox.layout_manager.orientation = Clutter.Orientation.VERTICAL;/' ui/header.js
          sed -i 's/let contentBox = new St.BoxLayout({ vertical: true, x_expand: true });/let contentBox = new St.BoxLayout({ x_expand: true }); contentBox.layout_manager.orientation = Clutter.Orientation.VERTICAL;/' ui/taggedArticleRow.js
          grep -n -E 'vertical|VERTICAL' ui/indicator.js ui/header.js ui/taggedArticleRow.js || true
      - name: Run the suite
        id: suite
        timeout-minutes: 15
        env:
          ONLY: ${{ inputs.only }}
          THEME: ${{ matrix.theme }}
        run: |
          args=(--theme "$THEME")
          [ -z "$ONLY" ] || args+=(--only "$ONLY")
          if [ "$(id -u)" -eq 0 ]; then
            chown -R tester "$E2E_HOME"
            runuser -u tester -- env HOME="$E2E_HOME" bash scripts/run-tests.sh "${args[@]}"
          else
            HOME="$E2E_HOME" bash scripts/run-tests.sh "${args[@]}"
          fi
      - name: Compute stats
        id: stats
        if: always()
        env:
          OUTCOME: ${{ steps.suite.outcome }}
        run: |
          dir=$(find "$E2E_HOME/rss-feed-e2e" -mindepth 1 -maxdepth 1 -type d 2> /dev/null | sort | tail -n 1) || true
          passed=0
          failed=0
          if [ -f "$dir/results.tsv" ]; then
            passed=$(awk -F'\t' '$4 == "PASS"' "$dir/results.tsv" | wc -l)
            failed=$(awk -F'\t' '$4 == "FAIL"' "$dir/results.tsv" | wc -l)
          fi
          total=$((passed + failed))
          if [ "$failed" -eq 0 ] && [ "$OUTCOME" = success ]; then
            emoji="✅"; alert="NOTE"; status_text="passed"
          elif [ "$failed" -eq 0 ]; then
            # the script stopped early or a session was killed, so the counts say nothing
            emoji="❌"; alert="CAUTION"; status_text="did not finish"
          else
            emoji="❌"; alert="CAUTION"; status_text="failed"
          fi
          {
            echo "dir=$dir"
            echo "passed=$passed"
            echo "failed=$failed"
            echo "total=$total"
            echo "emoji=$emoji"
            echo "alert=$alert"
            echo "status_text=$status_text"
          } >> "$GITHUB_OUTPUT"
      - name: Print failed steps
        if: always() && steps.stats.outputs.failed != '0'
        env:
          DIR: ${{ steps.stats.outputs.dir }}
        run: |
          awk -F'\t' '$4 == "FAIL" {printf "%s %s %s: %s\n    %s\n", $1, $2, $3, $5, $6}' "$DIR/results.tsv"
      - name: Print the end of full.log
        if: always() && steps.suite.outcome == 'failure' && steps.stats.outputs.dir != ''
        env:
          DIR: ${{ steps.stats.outputs.dir }}
        run: tail -n 200 "$DIR/full.log"
      - name: Write summary
        if: always()
        env:
          DIR: ${{ steps.stats.outputs.dir }}
          GNOME: ${{ matrix.gnome }}
          THEME: ${{ matrix.theme }}
          EMOJI: ${{ steps.stats.outputs.emoji }}
          ALERT: ${{ steps.stats.outputs.alert }}
          STATUS: ${{ steps.stats.outputs.status_text }}
          PASSED: ${{ steps.stats.outputs.passed }}
          FAILED: ${{ steps.stats.outputs.failed }}
          TOTAL: ${{ steps.stats.outputs.total }}
        run: |
          {
            echo "## $EMOJI End-to-end tests (GNOME Shell $GNOME, $THEME)"
            echo ""
            echo "> [!$ALERT]"
            echo "> Status: $STATUS, $TOTAL steps ($PASSED passed, $FAILED failed)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f "$DIR/report.md" ]; then
            echo "The script wrote no report, see the job log and full.log in the artifact." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          section() {
            awk -v heading="## $1" '$0 == heading {on = 1; next} /^## / {on = 0} on' "$DIR/report.md"
          }

          {
            echo "### Environment"
            section "Environment"
            if [ "$FAILED" -gt 0 ]; then
              echo "### Failed steps ($FAILED)"
              section "Failed steps"
            fi
            echo "<details><summary>All steps (click to expand)</summary>"
            section "All steps"
            echo "</details>"
            echo ""
            echo "---"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload output
        if: always() && steps.stats.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-gnome-${{ matrix.gnome }}-${{ matrix.theme }}
          path: ${{ steps.stats.outputs.dir }}

  report:
    name: Report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Collect results
        id: stats
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.test.result }}
        run: |
          passed=0
          failed=0
          rows=""
          : > steps.tsv
          for name in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | sort); do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "results/$name"
            p=$(awk -F'\t' '$4 == "PASS"' "results/$name/results.tsv" | wc -l)
            f=$(awk -F'\t' '$4 == "FAIL"' "results/$name/results.tsv" | wc -l)
            passed=$((passed + p))
            failed=$((failed + f))
            rows="$rows| $name | $p | $f |"$'\n'
            awk -F'\t' -v job="${name#e2e-gnome-}" '{print $2 " " $3 "\t" $4 "\t" $5 "\t" job}' "results/$name/results.tsv" >> steps.tsv
          done
          # a step that fails on several versions or in both themes is one broken step, and the badge counts it once
          steps=$(cut -f1 steps.tsv | sort -u | wc -l)
          broken=$(awk -F'\t' '$2 == "FAIL" {print $1}' steps.tsv | sort -u | wc -l)
          if [ "$failed" -gt 0 ]; then
            emoji="❌"; alert="CAUTION"; status_text="failed"; color="red"
            message="$broken failed"
          elif [ "$RESULT" != success ]; then
            # a job stopped early or a session was killed, so the counts say nothing
            emoji="❌"; alert="CAUTION"; status_text="did not finish"; color="red"
            message="did not finish"
          else
            emoji="✅"; alert="NOTE"; status_text="passed"; color="brightgreen"
            message="$steps passing"
          fi
          {
            echo "color=$color"
            echo "message=$message"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "$rows"
          echo "$status_text: $broken of $steps steps fail somewhere, $failed failures and $passed passes in all jobs, badge: $message"
          {
            echo "## $emoji End-to-end tests"
            echo ""
            echo "> [!$alert]"
            echo "> Status: $status_text, $broken of $steps steps fail in at least one job ($failed failures and $passed passes in all jobs together)"
            echo ""
            echo "| Job | Passed | Failed |"
            echo "|---|---|---|"
            printf '%s' "$rows"
            echo ""
            if [ "$broken" -gt 0 ]; then
              echo "| Failed step | Check | Jobs |"
              echo "|---|---|---|"
              awk -F'\t' '$2 == "FAIL"' steps.tsv | sort -s -t$'\t' -k1,1 | awk -F'\t' '
                $1 != last {if (last != "") print row " |"; gsub(/\|/, "/", $3); row = "| " $1 " | " $3 " | " $4; last = $1; next}
                {row = row ", " $4}
                END {if (last != "") print row " |"}'
              echo ""
            fi
            echo "---"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 87195eb23e76eae80cd14a6d80e56072
          filename: e2e.json
          label: e2e
          message: ${{ steps.stats.outputs.message }}
          color: ${{ steps.stats.outputs.color }}
          cacheSeconds: 0
